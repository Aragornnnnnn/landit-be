spring:
  datasource:
    url: jdbc:h2:mem:landit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

sentry:
  dsn:

management:
  otlp:
    metrics:
      export:
        enabled: false

landit:
  # H2에는 vector 타입과 <=> 연산자가 없어 자바 코사인 계산 구현을 사용한다.
  expression-search:
    mode: in-memory
  # 테스트는 AWS 자격증명 없이 돌도록 매니페스트를 클래스패스 리소스에서 읽는다.
  pronunciation-asset:
    manifest-mode: local
  auth:
    oidc:
      fake-enabled: true
    token:
      secret: landit-test-token-secret-that-is-long-enough
