spring:
  application:
    name: landit-be
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        enabled: ${LANDIT_NOTIFICATION_CONSUMER_ENABLED:false}
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 발음 평가 녹음 업로드 상한. 오디오 10MB + 여유분
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      service.version: ${APP_VERSION:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:30s}

landit:
  cors:
    allowed-origins: ${LANDIT_CORS_ALLOWED_ORIGINS:}
  auth:
    oidc:
      google-audiences: ${LANDIT_AUTH_OIDC_GOOGLE_AUDIENCES:}
      kakao-audiences: ${LANDIT_AUTH_OIDC_KAKAO_AUDIENCES:}
      apple-audiences: ${LANDIT_AUTH_OIDC_APPLE_AUDIENCES:}
    token:
      secret: ${LANDIT_AUTH_TOKEN_SECRET}
      access-expires-in-seconds: ${LANDIT_AUTH_TOKEN_ACCESS_EXPIRES_IN_SECONDS:1800}
      refresh-expires-in-seconds: ${LANDIT_AUTH_TOKEN_REFRESH_EXPIRES_IN_SECONDS:1209600}
  ai:
    client-mode: ${LANDIT_AI_CLIENT_MODE:local}
    base-url: ${LANDIT_AI_BASE_URL:}
    service-audience: ${LANDIT_AI_SERVICE_AUDIENCE:KOREAN_LEARNER}
    connect-timeout: ${LANDIT_AI_CONNECT_TIMEOUT:5s}
    request-timeout: ${LANDIT_AI_REQUEST_TIMEOUT:60s}
    session-feedback-request-timeout: ${LANDIT_AI_SESSION_FEEDBACK_REQUEST_TIMEOUT:120s}
    pronunciation-request-timeout: ${LANDIT_AI_PRONUNCIATION_REQUEST_TIMEOUT:20s}
  expression-search:
    mode: ${LANDIT_EXPRESSION_SEARCH_MODE:pgvector}
    max-candidates: ${LANDIT_EXPRESSION_SEARCH_MAX_CANDIDATES:30}
    distance-threshold: ${LANDIT_EXPRESSION_SEARCH_DISTANCE_THRESHOLD:0.6}
  memory-search:
    mode: ${LANDIT_MEMORY_SEARCH_MODE:pgvector}
  memory:
    write-enabled: ${LANDIT_MEMORY_WRITE_ENABLED:false}
    use-enabled: ${LANDIT_MEMORY_USE_ENABLED:false}
  content-image:
    bucket-name: ${CONTENT_BUCKET_NAME:}
    cloudfront-url: ${CONTENT_CLOUDFRONT_URL:}
    region: ${AWS_REGION:ap-northeast-2}
  pronunciation-asset:
    manifest-mode: ${LANDIT_PRONUNCIATION_MANIFEST_MODE:s3}
  notification:
    expo-base-url: ${LANDIT_NOTIFICATION_EXPO_BASE_URL:https://exp.host}
    expo-access-token: ${LANDIT_NOTIFICATION_EXPO_ACCESS_TOKEN:}
    connect-timeout: ${LANDIT_NOTIFICATION_CONNECT_TIMEOUT:5s}
    request-timeout: ${LANDIT_NOTIFICATION_REQUEST_TIMEOUT:10s}
    consumer-enabled: ${LANDIT_NOTIFICATION_CONSUMER_ENABLED:false}
    queue-url: ${SQS_PUSH_NOTIFICATIONS_QUEUE_URL:}
    receipt-delay-seconds: ${LANDIT_NOTIFICATION_RECEIPT_DELAY_SECONDS:900}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}

server:
  tomcat:
    mbeanregistry:
      enabled: true
