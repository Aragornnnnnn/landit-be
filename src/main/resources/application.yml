spring:
  lifecycle:
    timeout-per-shutdown-phase: 50s
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 50s
  application:
    name: landit-be
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        enabled: ${LANDIT_NOTIFICATION_CONSUMER_ENABLED:false}
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 발음 평가 녹음 업로드 상한. 오디오 10MB + 여유분
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      service.version: ${APP_VERSION:local}
    enable:
      http.server.requests.active: false
      spring.data.repository.invocations: false
    distribution:
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,750ms,1s,2s,3s,5s,10s,20s,30s,60s,120s
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:30s}

landit:
  free-talk:
    context:
      enabled: ${LANDIT_FREE_TALK_CONTEXT_ENABLED:false}
      allowed-user-ids: ${LANDIT_FREE_TALK_CONTEXT_ALLOWED_USER_IDS:}
      recent-rounds: ${LANDIT_FREE_TALK_CONTEXT_RECENT_ROUNDS:8}
      summary-trigger-rounds: ${LANDIT_FREE_TALK_CONTEXT_SUMMARY_TRIGGER_ROUNDS:12}
      summary-source-max-bytes: ${LANDIT_FREE_TALK_CONTEXT_SUMMARY_SOURCE_MAX_BYTES:6000}
      lease-seconds: ${LANDIT_FREE_TALK_CONTEXT_LEASE_SECONDS:30}
      retry-delay-seconds: ${LANDIT_FREE_TALK_CONTEXT_RETRY_DELAY_SECONDS:30}
    speaking-time-limit-ms: ${LANDIT_FREE_TALK_DAILY_SPEAKING_TIME_LIMIT_MS:${LANDIT_FREE_TALK_SPEAKING_TIME_LIMIT_MS:7200000}}
    daily-request-limit: ${LANDIT_FREE_TALK_DAILY_REQUEST_LIMIT:1000}
    requests-per-minute-limit: ${LANDIT_FREE_TALK_REQUESTS_PER_MINUTE_LIMIT:20}
    correction-retry:
      max-attempts: ${LANDIT_FREE_TALK_CORRECTION_MAX_ATTEMPTS:3}
      retry-delays: ${LANDIT_FREE_TALK_CORRECTION_RETRY_DELAYS:0s,1m,5m}
      batch-size: ${LANDIT_FREE_TALK_CORRECTION_RECOVERY_BATCH_SIZE:10}
      scheduling-enabled: ${LANDIT_FREE_TALK_CORRECTION_RECOVERY_ENABLED:true}
      recovery-interval-ms: ${LANDIT_FREE_TALK_CORRECTION_RECOVERY_INTERVAL_MS:30000}
  cors:
    allowed-origins: ${LANDIT_CORS_ALLOWED_ORIGINS:}
  auth:
    oidc:
      google-audiences: ${LANDIT_AUTH_OIDC_GOOGLE_AUDIENCES:}
      kakao-audiences: ${LANDIT_AUTH_OIDC_KAKAO_AUDIENCES:}
      apple-audiences: ${LANDIT_AUTH_OIDC_APPLE_AUDIENCES:}
    token:
      secret: ${LANDIT_AUTH_TOKEN_SECRET}
      access-expires-in-seconds: ${LANDIT_AUTH_TOKEN_ACCESS_EXPIRES_IN_SECONDS:1800}
      refresh-expires-in-seconds: ${LANDIT_AUTH_TOKEN_REFRESH_EXPIRES_IN_SECONDS:1209600}
  ai:
    internal-token: ${LANDIT_AI_INTERNAL_TOKEN:}
    client-mode: ${LANDIT_AI_CLIENT_MODE:local}
    base-url: ${LANDIT_AI_BASE_URL:}
    service-audience: ${LANDIT_AI_SERVICE_AUDIENCE:KOREAN_LEARNER}
    connect-timeout: ${LANDIT_AI_CONNECT_TIMEOUT:5s}
    request-timeout: ${LANDIT_AI_REQUEST_TIMEOUT:60s}
    context-summary-request-timeout: ${LANDIT_AI_CONTEXT_SUMMARY_REQUEST_TIMEOUT:10s}
    session-feedback-request-timeout: ${LANDIT_AI_SESSION_FEEDBACK_REQUEST_TIMEOUT:120s}
    pronunciation-request-timeout: ${LANDIT_AI_PRONUNCIATION_REQUEST_TIMEOUT:20s}
  expression-search:
    mode: ${LANDIT_EXPRESSION_SEARCH_MODE:pgvector}
    max-candidates: ${LANDIT_EXPRESSION_SEARCH_MAX_CANDIDATES:30}
    distance-threshold: ${LANDIT_EXPRESSION_SEARCH_DISTANCE_THRESHOLD:0.6}
  memory-search:
    mode: ${LANDIT_MEMORY_SEARCH_MODE:pgvector}
  memory:
    write-enabled: ${LANDIT_MEMORY_WRITE_ENABLED:false}
    use-enabled: ${LANDIT_MEMORY_USE_ENABLED:false}
  content-image:
    bucket-name: ${CONTENT_BUCKET_NAME:}
    cloudfront-url: ${CONTENT_CLOUDFRONT_URL:}
    region: ${AWS_REGION:ap-northeast-2}
  pronunciation-asset:
    manifest-mode: ${LANDIT_PRONUNCIATION_MANIFEST_MODE:s3}
  subscription:
    launched-at: ${LANDIT_SUBSCRIPTION_LAUNCHED_AT:}
    revenuecat:
      apply-sandbox-events: ${LANDIT_REVENUECAT_APPLY_SANDBOX_EVENTS:true}
      webhook-authorization: ${LANDIT_REVENUECAT_WEBHOOK_AUTHORIZATION:}
  notification:
    email:
      from: ${LANDIT_EMAIL_FROM:Landit <no-reply@landit.im>}
      configuration-set: ${LANDIT_EMAIL_CONFIGURATION_SET:}
    trial-reminder:
      annual-product-ids: ${LANDIT_TRIAL_REMINDER_ANNUAL_PRODUCT_IDS:}
      lead-time: ${LANDIT_TRIAL_REMINDER_LEAD_TIME:24h}
      max-lateness: ${LANDIT_TRIAL_REMINDER_MAX_LATENESS:2h}
      sandbox-enabled: ${LANDIT_TRIAL_REMINDER_SANDBOX_ENABLED:false}
    expo-base-url: ${LANDIT_NOTIFICATION_EXPO_BASE_URL:https://exp.host}
    expo-access-token: ${LANDIT_NOTIFICATION_EXPO_ACCESS_TOKEN:}
    connect-timeout: ${LANDIT_NOTIFICATION_CONNECT_TIMEOUT:5s}
    request-timeout: ${LANDIT_NOTIFICATION_REQUEST_TIMEOUT:10s}
    consumer-enabled: ${LANDIT_NOTIFICATION_CONSUMER_ENABLED:false}
    test-api-enabled: ${LANDIT_NOTIFICATION_TEST_API_ENABLED:false}
    queue-url: ${SQS_PUSH_NOTIFICATIONS_QUEUE_URL:}
    receipt-delay-seconds: ${LANDIT_NOTIFICATION_RECEIPT_DELAY_SECONDS:900}
    audience-query:
      url: ${LANDIT_PUSH_AUDIENCE_DB_URL:}
      username: ${LANDIT_PUSH_AUDIENCE_DB_USERNAME:}
      password: ${LANDIT_PUSH_AUDIENCE_DB_PASSWORD:}
      max-rows: ${LANDIT_PUSH_AUDIENCE_MAX_ROWS:100000}
    scheduler:
      group: ${LANDIT_PUSH_SCHEDULER_GROUP:default}
      queue-arn: ${LANDIT_PUSH_SCHEDULER_QUEUE_ARN:}
      role-arn: ${LANDIT_PUSH_SCHEDULER_ROLE_ARN:}
      dlq-arn: ${LANDIT_PUSH_SCHEDULER_DLQ_ARN:}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
