# 개발자가 수동 실행해 develop EC2 API 서비스에 배포합니다.
name: Deploy develop api

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-develop-api
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate develop DB schema
    uses: ./.github/workflows/flyway-migration.yml
    with:
      environment: develop
      ref: ${{ github.ref }}

  deploy:
    name: Build and deploy develop api
    needs: migrate
    runs-on: ubuntu-latest
    environment: develop
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_REGION"
          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"
          test -n "$EC2_INSTANCE_ID"

          expected_registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          if [ "$ECR_REGISTRY" != "$expected_registry" ]; then
            echo "ECR_REGISTRY does not match AWS_ACCOUNT_ID/AWS_REGION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run application tests
        run: ./gradlew test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg "APP_VERSION=${GITHUB_SHA}" \
            -t "$image_uri:${GITHUB_SHA}" \
            -t "$image_uri:latest" \
            .

      - name: Push Docker image
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$image_uri:${GITHUB_SHA}"
          docker push "$image_uri:latest"

      - name: Deploy image to develop EC2
        run: bash .github/scripts/deploy-ec2-service.sh api "$GITHUB_SHA"
