# 개발자가 main 브랜치에서 수동 실행해 prod ECS 서비스에 배포합니다.
name: Deploy prod api

on:
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전. 예시 1.2.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: prod-api-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate prod release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Validate main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deploy must run from main branch"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          release_tag="be-v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "$release_tag already exists"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  migrate:
    name: Migrate prod DB schema
    needs: preflight
    uses: ./.github/workflows/flyway-migration.yml
    with:
      environment: prod
      ref: ${{ github.ref }}

  deploy:
    name: Build and deploy prod api
    needs:
      - preflight
      - migrate
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL || secrets.HEALTH_CHECK_URL }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      CONTAINER_NAME: api
      ECR_IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
      RELEASE_RECORD: deployment-record.json

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_REGION"
          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"

          expected_registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          if [ "$ECR_REGISTRY" != "$expected_registry" ]; then
            echo "ECR_REGISTRY does not match AWS_ACCOUNT_ID/AWS_REGION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg "APP_VERSION=${GITHUB_SHA}" \
            -t "$image_uri:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$image_uri:${GITHUB_SHA}"

      - name: Deploy pinned ECS task revision
        id: deploy
        run: python3 .github/scripts/deploy-ecs-revision.py

      - name: Verify ECS service
        timeout-minutes: 10
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_CREATED_AT: ${{ steps.deploy.outputs.deployment_created_at }}
          TASK_DEFINITION: ${{ steps.deploy.outputs.task_definition }}
          IMAGE_DIGEST: ${{ steps.deploy.outputs.image_digest }}
        run: |
          bash .github/scripts/verify-ecs-deployment.sh

      - name: Preserve deployment and rollback versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RECORD }}
          retention-days: 90
          if-no-files-found: warn

      - name: Publish Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG 프로덕션 배포"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$RELEASE_RECORD" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
